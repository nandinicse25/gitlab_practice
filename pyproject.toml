[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-practice-app"
version = "0.1.0"
description = "A minimal runnable Python project scaffold"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Repo Maintainer"}]

[project.scripts]
gitlab-practice-app = "app.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
